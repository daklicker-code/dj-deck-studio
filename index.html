<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Deck Studio v0.1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header id="header">
    <div class="brand">
      <svg class="brand-logo" width="30" height="30" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
        <circle cx="15" cy="15" r="7"  fill="none" stroke="var(--accent)" stroke-width="1"/>
        <circle cx="15" cy="15" r="2.5" fill="var(--accent)"/>
        <line x1="15" y1="2" x2="15" y2="5" stroke="var(--accent)" stroke-width="1.5"/>
      </svg>
      <span class="brand-name">DJ DECK STUDIO</span>
      <span class="brand-ver">v0.1</span>
    </div>

    <div class="master-ctrl">
      <div class="bpm-box">
        <span class="ctrl-lbl">BPM</span>
        <button class="bpm-adj" id="bpm-dn">−</button>
        <input type="number" id="master-bpm" value="128" min="40" max="300">
        <button class="bpm-adj" id="bpm-up">+</button>
        <button class="tap-btn" id="tap-tempo">TAP</button>
      </div>
      <button class="sync-btn" id="sync-all">⟳ SYNC</button>
      <div class="mvol-box">
        <span class="ctrl-lbl">MASTER</span>
        <input type="range" id="master-vol" min="0" max="100" value="80">
        <span class="ctrl-val" id="mvol-val">80</span>
      </div>
    </div>

    <div class="hdr-actions">
      <button class="btn-primary" id="add-device">+ ADD DEVICE</button>
      <button class="btn-ghost"   id="btn-save">SAVE</button>
      <button class="btn-ghost"   id="btn-load">LOAD</button>
    </div>
  </header>

  <!-- STAGE -->
  <main id="stage">
    <div id="device-rack" style="display:none"></div>
    <div id="empty-state">
      <svg width="80" height="80" viewBox="0 0 80 80" class="empty-disc">
        <circle cx="40" cy="40" r="37" fill="#1a1a2a" stroke="#2a2a4a" stroke-width="2"/>
        <circle cx="40" cy="40" r="20" fill="#252535" stroke="#2a2a4a" stroke-width="1"/>
        <circle cx="40" cy="40" r="5"  fill="var(--accent)"/>
      </svg>
      <h2>Dein Deck ist leer</h2>
      <p>Füge Geräte hinzu, um dein Setup zu konfigurieren</p>
      <button class="btn-primary" id="empty-add">+ ADD DEVICE</button>
    </div>
  </main>

  <!-- DEVICE PICKER MODAL -->
  <div id="picker-modal" class="modal hidden">
    <div class="modal-bg" id="picker-bg"></div>
    <div class="modal-panel">
      <div class="modal-hdr">
        <h2>Gerät hinzufügen</h2>
        <button class="close-x" id="picker-close">✕</button>
      </div>
      <div class="plugin-grid" id="plugin-grid"></div>
    </div>
  </div>

  <!-- ZOOM MODAL -->
  <div id="zoom-modal" class="modal hidden">
    <div class="modal-bg" id="zoom-bg"></div>
    <div class="modal-panel zoom-panel">
      <div class="modal-hdr">
        <h2 id="zoom-title">Device</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn-ghost small" id="zoom-demo">▶ DEMO</button>
          <button class="btn-ghost small" id="zoom-cfg">⚙ CONFIG</button>
          <button class="close-x" id="zoom-close">✕</button>
        </div>
      </div>
      <div id="zoom-body"></div>
    </div>
  </div>

  <!-- CONFIG MODAL -->
  <div id="cfg-modal" class="modal hidden">
    <div class="modal-bg" id="cfg-bg"></div>
    <div class="modal-panel cfg-panel">
      <div class="modal-hdr">
        <h2 id="cfg-title">Configuration</h2>
        <button class="close-x" id="cfg-close">✕</button>
      </div>
      <div id="cfg-body"></div>
    </div>
  </div>

</div><!-- #app -->

<script type="module" src="js/main.js"></script>
</body>
</html>
